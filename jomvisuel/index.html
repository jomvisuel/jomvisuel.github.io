<style id="site-style">
/* Layout: cinematic single page — full-bleed showreel hero with viewfinder HUD, then tight editorial sections on a dark film-stock ground. Tokens below are overridden at runtime from the owner's saved settings. */
:root{
  --bg:#0B0B0C; --surface:#141416; --surface-2:#1C1C1F; --fg:#EDEDEF; --muted:#9A9AA2; --line:rgba(255,255,255,.10);
  --accent:#D4AF62; --on-accent:#111;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
img,video{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font:600 15px/1 var(--body);text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{transform:translateY(-1px)}
h1,h2,h3{text-wrap:balance;margin:0}
h2.sec{font-family:var(--display);font-weight:500;font-size:clamp(36px,5vw,64px);line-height:1.02;letter-spacing:-.01em}
h2.sec em{font-style:italic;color:var(--accent)}
section{padding-block:clamp(64px,9vw,120px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.sec-head p{max-width:46ch;color:var(--muted);margin:0}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.brand{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.02em;text-decoration:none;display:flex;align-items:baseline;gap:8px;min-width:0}
.brand .o{color:var(--accent)}
.brand small{font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.nav ul a{text-decoration:none;font-size:14px;color:var(--muted);font-weight:500}
.nav ul a:hover{color:var(--fg)}
.nav .btn{padding:10px 18px;font-size:14px}
@media (max-width:820px){.nav ul{display:none}.brand small{display:none}}
.navr{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:700 12px/1 var(--body);letter-spacing:.08em;padding:7px 10px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media (max-width:420px){.nav .btn{padding:9px 12px;font-size:13px}.navr{gap:8px}}



/* hero */
.hero{position:relative;overflow:hidden;min-height:min(86vh,860px);display:flex;align-items:flex-end;isolation:isolate;padding-block:0}
.hero .media{position:absolute;inset:0;z-index:-2;background:var(--surface)}
.hero .media video,.hero .media img{width:100%;height:100%;object-fit:cover;max-width:none}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 75%),linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.1) 35%,color-mix(in srgb,var(--bg) 94%,transparent) 100%)}
.hero h1,.hero .sub{color:#fff}.hero .sub{color:rgba(255,255,255,.86)}
@media (max-width:640px){.hero::after{background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.35) 40%,color-mix(in srgb,var(--bg) 96%,transparent) 100%)}}
.hud{position:absolute;inset:clamp(14px,3vw,32px);pointer-events:none;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.85)}
.hud i{position:absolute;width:34px;height:34px;border-color:rgba(255,255,255,.75);border-style:solid;border-width:0}
.hud .c1{left:0;top:0;border-left-width:2px;border-top-width:2px}.hud .c2{right:0;top:0;border-right-width:2px;border-top-width:2px}
.hud .c3{left:0;bottom:0;border-left-width:2px;border-bottom-width:2px}.hud .c4{right:0;bottom:0;border-right-width:2px;border-bottom-width:2px}
.hud .rec{position:absolute;left:48px;top:8px;display:flex;align-items:center;gap:8px}
.hud .rec b{width:9px;height:9px;border-radius:50%;background:#FF3B30;animation:blink 1s steps(2,end) infinite}
.hud .fmt{position:absolute;right:48px;top:8px}
.hud .tc{position:absolute;right:48px;bottom:8px;font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion: reduce){.hud .rec b{animation:none}}
.hero .content{padding-block:clamp(120px,16vw,200px) clamp(56px,8vw,96px);width:100%}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(46px,8.6vw,128px);line-height:.95;letter-spacing:-.02em;max-width:14ch}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero .sub{max-width:52ch;font-size:clamp(16px,1.6vw,19px);color:color-mix(in srgb,var(--fg) 82%,transparent);margin:22px 0 32px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .eyebrow{color:var(--accent);margin-bottom:18px;display:block}

/* marquee */
.band{border-block:1px solid var(--line);overflow:hidden;padding-block:18px;background:var(--surface)}
.band .track{display:flex;gap:48px;width:max-content;animation:scroll 38s linear infinite;font-family:var(--display);font-style:italic;font-size:clamp(22px,3vw,34px);white-space:nowrap}
.band .track span{display:flex;align-items:center;gap:48px}
.band .track span::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
@keyframes scroll{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.band .track{animation:none}}

/* services */
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.svc article{background:var(--bg);padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:14px;min-width:0;transition:background .25s}
.svc article:hover{background:var(--surface)}
.svc svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.svc h3{font-family:var(--body);font-weight:700;font-size:20px}
.svc p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:900px){.svc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.svc{grid-template-columns:minmax(0,1fr)}}

/* portfolio */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 13px/1 var(--body);padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-auto-flow:dense;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:clamp(200px,22vw,290px);gap:14px}
.work{position:relative;border-radius:16px;overflow:hidden;background:var(--surface);cursor:pointer;border:1px solid var(--line);padding:0;color:inherit;text-align:left;min-width:0}
.work.tall{grid-row:span 2}
.work.wide{grid-column:span 2}
.work img,.work video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;transition:transform .6s ease}
.work:hover img,.work:hover video{transform:scale(1.04)}
.work .cap{position:absolute;inset:auto 0 0 0;padding:18px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;display:flex;justify-content:space-between;align-items:end;gap:12px}
.work .cap b{display:block;font-weight:700;font-size:17px;line-height:1.25}
.work .cap span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.work .play{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.6);display:grid;place-items:center;backdrop-filter:blur(6px)}
.work .play::before{content:"";border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.empty{border:1px dashed var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.work.wide{grid-column:span 2}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr);grid-auto-rows:240px}.work.wide{grid-column:auto}.work.tall{grid-row:span 2}}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;counter-reset:s}
.steps li{list-style:none;border-top:1px solid var(--line);padding-top:22px;min-width:0}
.steps .n{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.14em}
.steps h3{font-family:var(--display);font-weight:500;font-size:28px;margin:10px 0 8px}
.steps p{margin:0;color:var(--muted);font-size:15px}
.steps ol,.steps{padding:0;margin:0}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:minmax(0,1fr)}}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.about p{font-size:clamp(17px,1.6vw,20px);color:color-mix(in srgb,var(--fg) 85%,transparent);max-width:58ch;white-space:pre-line;margin:22px 0 0}
.about figure{margin:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--surface);max-width:100%}
.about figure img{width:100%;height:100%;object-fit:cover}
@media (max-width:820px){.about{grid-template-columns:minmax(0,1fr)}}

/* contact */
.contact{border-top:1px solid var(--line)}
.contact h2{font-family:var(--display);font-weight:500;font-size:clamp(48px,9vw,132px);line-height:.95;letter-spacing:-.02em;max-width:12ch}
.contact h2 em{font-style:italic;color:var(--accent)}
.rows{margin-top:clamp(32px,5vw,56px);display:grid;gap:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:20px;border-bottom:1px solid var(--line)}
.row .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row .v{font-size:clamp(18px,2.2vw,26px);font-weight:600;overflow-wrap:anywhere;user-select:all;min-width:0}
.row .v a{text-decoration:none}
.row .v a:hover{color:var(--accent)}
.copy{font:600 13px/1 var(--body);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr) auto}.row .k{grid-column:1 / -1}}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* lightbox */
dialog.lb{border:0;padding:0;background:transparent;max-width:min(1200px,94vw);width:100%;color:#fff}
dialog.lb::backdrop{background:rgba(0,0,0,.88)}
dialog.lb .box{position:relative;border-radius:14px;overflow:hidden;background:#000}
dialog.lb video,dialog.lb img{width:100%;max-height:82vh;object-fit:contain;margin:0 auto}
dialog.lb .close{position:absolute;right:10px;top:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:22px;cursor:pointer}
dialog.lb p{margin:12px 2px 0;font-weight:600}

</style>

 cut:'<circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.2 7.6L20 18M8.2 16.4L20 6"/>',
 grade:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M12 12l7.4-4.2M12 12l7.4 4.2"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
 wave:'<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/>'};
const firstName=()=>{const n=S.name||'';return n.split(' ')[0]||n;};
function applyTheme(){
 const r=document.documentElement.style;const dark=S.mode!=='light';
 const T=dark?{bg:'#0B0B0C',surface:'#141416','surface-2':'#1C1C1F',fg:'#EDEDEF',muted:'#9A9AA2',line:'rgba(255,255,255,.10)'}:{bg:'#F4F3F0',surface:'#FFFFFF','surface-2':'#ECEBE7',fg:'#141416',muted:'#5F5F67',line:'rgba(0,0,0,.10)'};
 Object.entries(T).forEach(([k,v])=>r.setProperty('--'+k,v));r.setProperty('color-scheme',dark?'dark':'light');
 r.setProperty('--accent',S.accent||'#D4AF62');
 const c=(S.accent||'#D4AF62').replace('#','');const rr=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
 r.setProperty('--on-accent',(rr*299+g*587+b*114)/1000>150?'#111111':'#FFFFFF');
 r.setProperty('--display',(FONTS[S.font]||FONTS.cinema)[0]);
 document.title=S.name||'Studio';
}
const UI={fr:{nav:['Services','Portfolio','Processus','À propos'],quote:'Demander un devis',seeWork:'Voir le portfolio',contactUs:'Nous contacter',
 svcH:"Ce que l'on *crée*",svcP:"De l'idée au fichier final : on gère chaque étape pour que votre image soit à la hauteur de votre projet.",
 pfH:'Nos *réalisations*',all:'Tout',filterLbl:'Filtrer le portfolio',soon:'Le portfolio arrive bientôt.',open:'Ouvrir',
 prH:'Comment on *travaille*',about:'À propos',studio:n=>'Le studio *'+n+'*',contact:'Contact',
 email:'Courriel',phone:'Téléphone',city:'Ville',copy:'Copier',copied:'Copié',selected:'Sélectionné',nodetails:'Coordonnées à venir.',close:'Fermer',navLbl:'Navigation principale',langLbl:'Langue'},
 en:{nav:['Services','Portfolio','Process','About'],quote:'Request a quote',seeWork:'See our work',contactUs:'Contact us',
 svcH:'What we *create*',svcP:'From idea to final file, we handle every step so your visuals match the ambition of your project.',
 pfH:'Our *work*',all:'All',filterLbl:'Filter the portfolio',soon:'Portfolio coming soon.',open:'Open',
 prH:'How we *work*',about:'About',studio:n=>'The *'+n+'* studio',contact:'Contact',
 email:'Email',phone:'Phone',city:'City',copy:'Copy',copied:'Copied',selected:'Selected',nodetails:'Contact details coming soon.',close:'Close',navLbl:'Main navigation',langLbl:'Language'}};
let LANG=(()=>{try{const v=localStorage.getItem('jom-lang');if(v==='fr'||v==='en')return v;}catch(e){}return /^fr/i.test(navigator.language||'fr')?'fr':'en';})();
const U=k=>UI[LANG][k];
const E=()=>S.en||{};
function tx(k){const e=E();return LANG==='en'&&e[k]?e[k]:S[k];}
function svcT(i,f){const e=(E().services||[])[i];return LANG==='en'&&e&&e[f]?e[f]:S.services[i][f];}
function prT(i,f){const e=(E().process||[])[i];return LANG==='en'&&e&&e[f]?e[f]:S.process[i][f];}
function catL(c){const m=E().cats||{};return LANG==='en'&&m[c]?m[c]:c;}
function pT(p){return LANG==='en'&&p.title_en?p.title_en:p.title;}
function brand(){const n=esc(S.name||'');const parts=n.split(' ');const first=parts.shift();const rest=parts.join(' ');
 return `<a class="brand" href="#top">${first.replace(/[ØO]/,m=>`<span class="o">${m}</span>`)}${rest?`<small>${rest}</small>`:''}</a>`;}
function cats(){const s=new Set();S.portfolio.forEach(p=>p.cat&&s.add(p.cat));return [...s];}
let filter='*';
function workCard(p,i){const vid=p.type==='video';const cls=p.layout==='tall'?' tall':p.layout==='wide'?' wide':'';const t=pT(p);
 const media=vid?(p.poster?`<img src="${esc(p.poster)}" alt="" loading="lazy">`:`<video src="${esc(p.src)}#t=1" muted playsinline preload="metadata"></video>`):`<img src="${esc(p.src)}" alt="${esc(t)}" loading="lazy">`;
 return `<button class="work${cls}" data-i="${i}" aria-label="${U('open')} ${esc(t)}">${media}<div class="cap"><div><b>${esc(t)}</b><span>${esc([catL(p.cat),p.meta].filter(Boolean).join(' · '))}</span></div>${vid?'<i class="play" aria-hidden="true"></i>':''}</div></button>`;}
function render(){
 applyTheme();document.documentElement.lang=LANG;
 const C=S.contact||{};
 const rows=[['email',C.email,C.email?`<span>${esc(C.email)}</span>`:''],['phone',C.phone,C.phone?`<span>${esc(C.phone)}</span>`:''],['ig',C.instagram,C.instagram?`<a href="${esc(C.instagram.startsWith('http')?C.instagram:'https://instagram.com/'+C.instagram.replace('@',''))}" target="_blank" rel="noopener">${esc(C.instagram.startsWith('http')?'@'+C.instagram.replace(/\/$/,'').split('/').pop():C.instagram)}</a>`:''],['city',C.city,C.city?`<span>${esc(C.city)}</span>`:'']].filter(r=>r[1]);
 const cs=cats();const items=S.portfolio.map((p,i)=>[p,i]).filter(([p])=>filter==='*'||p.cat===filter);
 const mq=(tx('marquee')||[]).map(w=>`<span>${esc(w)}</span>`).join('');
 const nav=U('nav');
 app.innerHTML=`
 <nav class="nav" aria-label="${U('navLbl')}"><div class="wrap">${brand()}
  <ul><li><a href="#services">${nav[0]}</a></li><li><a href="#portfolio">${nav[1]}</a></li><li><a href="#processus">${nav[2]}</a></li><li><a href="#apropos">${nav[3]}</a></li></ul>
  <div class="navr"><div class="lang" role="group" aria-label="${U('langLbl')}"><button data-lang="fr" aria-pressed="${LANG==='fr'}">FR</button><button data-lang="en" aria-pressed="${LANG==='en'}">EN</button></div>
  <a class="btn primary" href="#contact">${U('quote')}</a></div></div></nav>
 <header class="hero" id="top">
  <div class="media">${S.heroVideo?`<video src="${esc(S.heroVideo)}" ${S.heroPoster?`poster="${esc(S.heroPoster)}"`:''} autoplay muted loop playsinline></video>`:(S.heroPoster?`<img src="${esc(S.heroPoster)}" alt="">`:'')}</div>
  <div class="hud" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><div class="rec"><b></b>REC</div><div class="fmt">4K · 60 FPS</div><div class="tc" id="tc">00:00:00:00</div></div>
  <div class="content wrap"><span class="eyebrow">${esc(tx('tagline'))}</span><h1>${emph(tx('heroTitle'))}</h1><p class="sub">${esc(tx('heroSub'))}</p>
   <div class="ctas"><a class="btn primary" href="#portfolio">${U('seeWork')}</a><a class="btn" href="#contact">${U('contactUs')}</a></div></div>
 </header>
 <div class="band" aria-hidden="true"><div class="track">${mq}${mq}${mq}${mq}</div></div>
 <section id="services"><div class="wrap">
  <div class="sec-head"><h2 class="sec">${emph(U('svcH'))}</h2><p>${esc(U('svcP'))}</p></div>
  <div class="svc">${S.services.map((s,i)=>`<article><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[s.icon]||ICONS.spark}</svg><h3>${esc(svcT(i,'t'))}</h3><p>${esc(svcT(i,'d'))}</p></article>`).join('')}</div>
 </div></section>
 <section id="portfolio" style="padding-top:0"><div class="wrap">
  <div class="sec-head"><h2 class="sec">${emph(U('pfH'))}</h2>
   ${cs.length>1?`<div class="filters" role="group" aria-label="${U('filterLbl')}">${['*',...cs].map(c=>`<button class="chip" data-f="${esc(c)}" aria-pressed="${c===filter}">${esc(c==='*'?U('all'):catL(c))}</button>`).join('')}</div>`:''}</div>
  ${items.length?`<div class="grid">${items.map(([p,i])=>workCard(p,i)).join('')}</div>`:`<div class="empty">${U('soon')}</div>`}
 </div></section>
 <section id="processus" style="padding-top:0"><div class="wrap">
  <div class="sec-head"><h2 class="sec">${emph(U('prH'))}</h2></div>
  <ol class="steps">${S.process.map((p,i)=>`<li><span class="n">${String(i+1).padStart(2,'0')} / ${String(S.process.length).padStart(2,'0')}</span><h3>${esc(prT(i,'t'))}</h3><p>${esc(prT(i,'d'))}</p></li>`).join('')}</ol>
 </div></section>
 <section id="apropos" style="padding-top:0"><div class="wrap about">
  <div><span class="eyebrow">${U('about')}</span><h2 class="sec" style="margin-top:14px">${emph(UI[LANG].studio(firstName()))}</h2><p>${esc(tx('about'))}</p></div>
  <figure>${S.aboutImg?`<img src="${esc(S.aboutImg)}" alt="${esc(S.name)}">`:''}</figure>
 </div></section>
 <section class="contact" id="contact"><div class="wrap">
  <span class="eyebrow">${U('contact')}</span>
  <h2 style="margin-top:16px">${emph(tx('heroTitle'))}</h2>
  ${rows.length?`<div class="rows">${rows.map(([k,v,h])=>`<div class="row"><span class="k">${k==='ig'?'Instagram':U(k)}</span><span class="v">${h}</span>${k==='city'?'<span></span>':`<button class="copy" data-copy="${esc(v)}">${U('copy')}</button>`}</div>`).join('')}</div>`:`<p class="eyebrow" style="margin-top:32px">${U('nodetails')}</p>`}
 </div></section>
 <footer><div class="wrap"><span>© ${new Date().getFullYear()} ${esc(S.name)}</span><span>${esc(tx('tagline'))}</span></div></footer>
 <dialog class="lb" id="lb"><div class="box"><button class="close" aria-label="${U('close')}">×</button><div id="lbm"></div></div><p id="lbt"></p></dialog>`;
 bind();
}
function bind(){
 app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{if(LANG===b.dataset.lang)return;LANG=b.dataset.lang;try{localStorage.setItem('jom-lang',LANG);}catch(e){}const y=scrollY;render();scrollTo(0,y);});
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();document.getElementById('portfolio').scrollIntoView({block:'start'});});
 app.querySelectorAll('.work').forEach(b=>{b.onclick=()=>openLb(+b.dataset.i);
  const v=b.querySelector('video');if(v){b.onmouseenter=()=>{v.play().catch(()=>{})};b.onmouseleave=()=>{v.pause()};}});
 app.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const t=b.dataset.copy;try{await navigator.clipboard.writeText(t);b.textContent=U('copied');}catch(e){const s=b.parentElement.querySelector('.v');const r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent=U('selected');}setTimeout(()=>b.textContent=U('copy'),1600);});
 const lb=document.getElementById('lb');lb.querySelector('.close').onclick=()=>lb.close();lb.addEventListener('close',()=>{document.getElementById('lbm').innerHTML='';});
 lb.addEventListener('click',e=>{if(e.target===lb)lb.close();});
}
function openLb(i){const p=S.portfolio[i];if(!p)return;const lb=document.getElementById('lb');const t=pT(p);
 document.getElementById('lbm').innerHTML=p.type==='video'?`<video src="${esc(p.src)}" ${p.poster?`poster="${esc(p.poster)}"`:''} controls autoplay playsinline></video>`:`<img src="${esc(p.src)}" alt="${esc(t)}">`;
 document.getElementById('lbt').textContent=[t,p.meta].filter(Boolean).join(' — ');lb.showModal();}
// timecode
let t0=performance.now();(function tick(){const el=document.getElementById('tc');if(el){const f=Math.floor((performance.now()-t0)/1000*60);const s=Math.floor(f/60),m=Math.floor(s/60);el.textContent=`00:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}:${String(f%60).padStart(2,'0')}`;}
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick);})();
render();

})();
</script>
