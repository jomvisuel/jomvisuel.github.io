<style id="site-style">
/* Layout: cinematic single page — full-bleed showreel hero with viewfinder HUD, then tight editorial sections on a dark film-stock ground. Tokens below are overridden at runtime from the owner's saved settings. */
:root{
  --bg:#0B0B0C; --surface:#141416; --surface-2:#1C1C1F; --fg:#EDEDEF; --muted:#9A9AA2; --line:rgba(255,255,255,.10);
  --accent:#D4AF62; --on-accent:#111;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
img,video{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font:600 15px/1 var(--body);text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{transform:translateY(-1px)}
h1,h2,h3{text-wrap:balance;margin:0}
h2.sec{font-family:var(--display);font-weight:500;font-size:clamp(36px,5vw,64px);line-height:1.02;letter-spacing:-.01em}
h2.sec em{font-style:italic;color:var(--accent)}
section{padding-block:clamp(64px,9vw,120px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.sec-head p{max-width:46ch;color:var(--muted);margin:0}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.brand{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.02em;text-decoration:none;display:flex;align-items:baseline;gap:8px;min-width:0}
.brand .o{color:var(--accent)}
.brand small{font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.nav ul a{text-decoration:none;font-size:14px;color:var(--muted);font-weight:500}
.nav ul a:hover{color:var(--fg)}
.nav .btn{padding:10px 18px;font-size:14px}
@media (max-width:820px){.nav ul{display:none}.brand small{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;min-height:min(86vh,860px);display:flex;align-items:flex-end;isolation:isolate;padding-block:0}
.hero .media{position:absolute;inset:0;z-index:-2;background:var(--surface)}
.hero .media video,.hero .media img{width:100%;height:100%;object-fit:cover;max-width:none}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 75%),linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.1) 35%,color-mix(in srgb,var(--bg) 94%,transparent) 100%)}
.hero h1,.hero .sub{color:#fff}.hero .sub{color:rgba(255,255,255,.86)}
@media (max-width:640px){.hero::after{background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.35) 40%,color-mix(in srgb,var(--bg) 96%,transparent) 100%)}}
.hud{position:absolute;inset:clamp(14px,3vw,32px);pointer-events:none;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.85)}
.hud i{position:absolute;width:34px;height:34px;border-color:rgba(255,255,255,.75);border-style:solid;border-width:0}
.hud .c1{left:0;top:0;border-left-width:2px;border-top-width:2px}.hud .c2{right:0;top:0;border-right-width:2px;border-top-width:2px}
.hud .c3{left:0;bottom:0;border-left-width:2px;border-bottom-width:2px}.hud .c4{right:0;bottom:0;border-right-width:2px;border-bottom-width:2px}
.hud .rec{position:absolute;left:48px;top:8px;display:flex;align-items:center;gap:8px}
.hud .rec b{width:9px;height:9px;border-radius:50%;background:#FF3B30;animation:blink 1s steps(2,end) infinite}
.hud .fmt{position:absolute;right:48px;top:8px}
.hud .tc{position:absolute;right:48px;bottom:8px;font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion: reduce){.hud .rec b{animation:none}}
.hero .content{padding-block:clamp(120px,16vw,200px) clamp(56px,8vw,96px);width:100%}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(46px,8.6vw,128px);line-height:.95;letter-spacing:-.02em;max-width:14ch}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero .sub{max-width:52ch;font-size:clamp(16px,1.6vw,19px);color:color-mix(in srgb,var(--fg) 82%,transparent);margin:22px 0 32px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .eyebrow{color:var(--accent);margin-bottom:18px;display:block}

/* marquee */
.band{border-block:1px solid var(--line);overflow:hidden;padding-block:18px;background:var(--surface)}
.band .track{display:flex;gap:48px;width:max-content;animation:scroll 38s linear infinite;font-family:var(--display);font-style:italic;font-size:clamp(22px,3vw,34px);white-space:nowrap}
.band .track span{display:flex;align-items:center;gap:48px}
.band .track span::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
@keyframes scroll{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.band .track{animation:none}}

/* services */
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.svc article{background:var(--bg);padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:14px;min-width:0;transition:background .25s}
.svc article:hover{background:var(--surface)}
.svc svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.svc h3{font-family:var(--body);font-weight:700;font-size:20px}
.svc p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:900px){.svc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.svc{grid-template-columns:minmax(0,1fr)}}

/* portfolio */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 13px/1 var(--body);padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-auto-flow:dense;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:clamp(200px,22vw,290px);gap:14px}
.work{position:relative;border-radius:16px;overflow:hidden;background:var(--surface);cursor:pointer;border:1px solid var(--line);padding:0;color:inherit;text-align:left;min-width:0}
.work.tall{grid-row:span 2}
.work.wide{grid-column:span 2}
.work img,.work video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;transition:transform .6s ease}
.work:hover img,.work:hover video{transform:scale(1.04)}
.work .cap{position:absolute;inset:auto 0 0 0;padding:18px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;display:flex;justify-content:space-between;align-items:end;gap:12px}
.work .cap b{display:block;font-weight:700;font-size:17px;line-height:1.25}
.work .cap span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.work .play{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.6);display:grid;place-items:center;backdrop-filter:blur(6px)}
.work .play::before{content:"";border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.empty{border:1px dashed var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.work.wide{grid-column:span 2}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr);grid-auto-rows:240px}.work.wide{grid-column:auto}.work.tall{grid-row:span 2}}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;counter-reset:s}
.steps li{list-style:none;border-top:1px solid var(--line);padding-top:22px;min-width:0}
.steps .n{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.14em}
.steps h3{font-family:var(--display);font-weight:500;font-size:28px;margin:10px 0 8px}
.steps p{margin:0;color:var(--muted);font-size:15px}
.steps ol,.steps{padding:0;margin:0}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:minmax(0,1fr)}}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.about p{font-size:clamp(17px,1.6vw,20px);color:color-mix(in srgb,var(--fg) 85%,transparent);max-width:58ch;white-space:pre-line;margin:22px 0 0}
.about figure{margin:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--surface);max-width:100%}
.about figure img{width:100%;height:100%;object-fit:cover}
@media (max-width:820px){.about{grid-template-columns:minmax(0,1fr)}}

/* contact */
.contact{border-top:1px solid var(--line)}
.contact h2{font-family:var(--display);font-weight:500;font-size:clamp(48px,9vw,132px);line-height:.95;letter-spacing:-.02em;max-width:12ch}
.contact h2 em{font-style:italic;color:var(--accent)}
.rows{margin-top:clamp(32px,5vw,56px);display:grid;gap:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:20px;border-bottom:1px solid var(--line)}
.row .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row .v{font-size:clamp(18px,2.2vw,26px);font-weight:600;overflow-wrap:anywhere;user-select:all;min-width:0}
.row .v a{text-decoration:none}
.row .v a:hover{color:var(--accent)}
.copy{font:600 13px/1 var(--body);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr) auto}.row .k{grid-column:1 / -1}}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* lightbox */
dialog.lb{border:0;padding:0;background:transparent;max-width:min(1200px,94vw);width:100%;color:#fff}
dialog.lb::backdrop{background:rgba(0,0,0,.88)}
dialog.lb .box{position:relative;border-radius:14px;overflow:hidden;background:#000}
dialog.lb video,dialog.lb img{width:100%;max-height:82vh;object-fit:contain;margin:0 auto}
dialog.lb .close{position:absolute;right:10px;top:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:22px;cursor:pointer}
dialog.lb p{margin:12px 2px 0;font-weight:600}

/* editor */
.edit-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ed{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:90;background:#121214;color:#EDEDEF;border-left:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;font-family:"Manrope",system-ui,sans-serif;font-size:14px;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.ed header b{font-size:16px}
.ed .tabs{display:flex;gap:4px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.1)}
.ed .tabs button{flex:none;font:600 12px/1 inherit;font-family:inherit;padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#bbb;cursor:pointer}
.ed .tabs button[aria-selected="true"]{background:#EDEDEF;color:#111;border-color:#EDEDEF}
.ed .body{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.ed label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:12px;color:#bdbdc4;letter-spacing:.02em}
.ed input[type=text],.ed input[type=email],.ed input[type=url],.ed textarea,.ed select{font:500 14px/1.4 inherit;font-family:inherit;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#1b1b1e;color:#fff;width:100%}
.ed textarea{min-height:84px;resize:vertical}
.ed .hint{font-weight:400;color:#8d8d95;font-size:12px;margin:0}
.ed .sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed .sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.ed .sw button[aria-pressed="true"]{border-color:#fff}
.ed .seg{display:flex;gap:6px;flex-wrap:wrap}
.ed .seg button{font:600 13px/1 inherit;font-family:inherit;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#1b1b1e;color:#ddd;cursor:pointer}
.ed .seg button[aria-pressed="true"]{border-color:#fff;color:#fff;background:#2a2a2e}
.ed .item{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.ed .item .th{width:64px;height:64px;border-radius:8px;background:#222 center/cover no-repeat;overflow:hidden}
.ed .item .th video{width:64px;height:64px;object-fit:cover}
.ed .item .f{display:flex;flex-direction:column;gap:8px;min-width:0}
.ed .item .acts{display:flex;gap:6px;flex-wrap:wrap}
.ed .mini{font:600 12px/1 inherit;font-family:inherit;padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#ddd;cursor:pointer}
.ed .mini.danger{color:#ff8a80;border-color:rgba(255,138,128,.4)}
.ed footer{border-top:1px solid rgba(255,255,255,.1);padding:14px 18px;display:flex;gap:10px;align-items:center;justify-content:space-between;color:#aaa;font-size:12px}
.ed footer .btn{padding:12px 18px}
.ed .status{min-height:1.2em}
.ed fieldset{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:0}
.ed legend{font-weight:700;font-size:12px;padding:0 6px;color:#ddd}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>

<script id="site-app">
(function(){
const S=JSON.parse(document.getElementById('site-state').textContent);
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emph=s=>esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
const FONTS={cinema:['"Bodoni Moda","Didot","Bodoni 72",Georgia,serif','Cinéma'],moderne:['"Syne","Manrope",system-ui,sans-serif','Moderne'],classique:['"Playfair Display",Georgia,serif','Classique']};
const ACCENTS=[['#D4AF62','Or'],['#C9CBD1','Argent'],['#F2F2F2','Blanc'],['#E5484D','Rouge'],['#5B8DEF','Bleu'],['#3DD68C','Vert']];
const ICONS={cam:'<rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/><circle cx="7" cy="5" r="1.5"/><circle cx="12" cy="5" r="1.5"/>',
 photo:'<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3.6"/>',
 cut:'<circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.2 7.6L20 18M8.2 16.4L20 6"/>',
 grade:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M12 12l7.4-4.2M12 12l7.4 4.2"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
 wave:'<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/>'};
const firstName=()=>{const n=S.name||'';return n.split(' ')[0]||n;};
function applyTheme(){
 const r=document.documentElement.style;const dark=S.mode!=='light';
 const T=dark?{bg:'#0B0B0C',surface:'#141416','surface-2':'#1C1C1F',fg:'#EDEDEF',muted:'#9A9AA2',line:'rgba(255,255,255,.10)'}:{bg:'#F4F3F0',surface:'#FFFFFF','surface-2':'#ECEBE7',fg:'#141416',muted:'#5F5F67',line:'rgba(0,0,0,.10)'};
 Object.entries(T).forEach(([k,v])=>r.setProperty('--'+k,v));r.setProperty('color-scheme',dark?'dark':'light');
 r.setProperty('--accent',S.accent||'#D4AF62');
 const c=(S.accent||'#D4AF62').replace('#','');const rr=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
 r.setProperty('--on-accent',(rr*299+g*587+b*114)/1000>150?'#111111':'#FFFFFF');
 r.setProperty('--display',(FONTS[S.font]||FONTS.cinema)[0]);
 document.title=S.name||'Studio';
}
function brand(){const n=esc(S.name||'');const parts=n.split(' ');const first=parts.shift();const rest=parts.join(' ');
 return `<a class="brand" href="#top">${first.replace(/[ØO]/,m=>`<span class="o">${m}</span>`)}${rest?`<small>${rest}</small>`:''}</a>`;}
function cats(){const s=new Set();S.portfolio.forEach(p=>p.cat&&s.add(p.cat));return [...s];}
let filter='Tout';
function workCard(p,i){const vid=p.type==='video';const cls=p.layout==='tall'?' tall':p.layout==='wide'?' wide':'';
 const media=vid?(p.poster?`<img src="${esc(p.poster)}" alt="" loading="lazy">`:`<video src="${esc(p.src)}#t=1" muted playsinline preload="metadata"></video>`):`<img src="${esc(p.src)}" alt="${esc(p.title)}" loading="lazy">`;
 return `<button class="work${cls}" data-i="${i}" aria-label="Ouvrir ${esc(p.title)}">${media}<div class="cap"><div><b>${esc(p.title)}</b><span>${esc([p.cat,p.meta].filter(Boolean).join(' · '))}</span></div>${vid?'<i class="play" aria-hidden="true"></i>':''}</div></button>`;}
function render(){
 applyTheme();
 const C=S.contact||{};
 const rows=[['Courriel',C.email,C.email?`<span>${esc(C.email)}</span>`:''],['Téléphone',C.phone,C.phone?`<span>${esc(C.phone)}</span>`:''],['Instagram',C.instagram,C.instagram?`<a href="${esc(C.instagram.startsWith('http')?C.instagram:'https://instagram.com/'+C.instagram.replace('@',''))}" target="_blank" rel="noopener">${esc(C.instagram.startsWith('http')?'@'+C.instagram.replace(/\/$/,'').split('/').pop():C.instagram)}</a>`:''],['Ville',C.city,C.city?`<span>${esc(C.city)}</span>`:'']].filter(r=>r[1]);
 const cs=cats();const items=S.portfolio.map((p,i)=>[p,i]).filter(([p])=>filter==='Tout'||p.cat===filter);
 const mq=(S.marquee||[]).map(w=>`<span>${esc(w)}</span>`).join('');
 app.innerHTML=`
 <nav class="nav" aria-label="Navigation principale"><div class="wrap">${brand()}
  <ul><li><a href="#services">Services</a></li><li><a href="#portfolio">Portfolio</a></li><li><a href="#processus">Processus</a></li><li><a href="#apropos">À propos</a></li></ul>
  <a class="btn primary" href="#contact">Demander un devis</a></div></nav>
 <header class="hero" id="top">
  <div class="media">${S.heroVideo?`<video src="${esc(S.heroVideo)}" ${S.heroPoster?`poster="${esc(S.heroPoster)}"`:''} autoplay muted loop playsinline></video>`:(S.heroPoster?`<img src="${esc(S.heroPoster)}" alt="">`:'')}</div>
  <div class="hud" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><div class="rec"><b></b>REC</div><div class="fmt">4K · 60 FPS</div><div class="tc" id="tc">00:00:00:00</div></div>
  <div class="content wrap"><span class="eyebrow">${esc(S.tagline)}</span><h1>${emph(S.heroTitle)}</h1><p class="sub">${esc(S.heroSub)}</p>
   <div class="ctas"><a class="btn primary" href="#portfolio">Voir le portfolio</a><a class="btn" href="#contact">Nous contacter</a></div></div>
 </header>
 <div class="band" aria-hidden="true"><div class="track">${mq}${mq}${mq}${mq}</div></div>
 <section id="services"><div class="wrap">
  <div class="sec-head"><h2 class="sec">Ce que l'on <em>crée</em></h2><p>De l'idée au fichier final : on gère chaque étape pour que votre image soit à la hauteur de votre projet.</p></div>
  <div class="svc">${S.services.map(s=>`<article><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[s.icon]||ICONS.spark}</svg><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></article>`).join('')}</div>
 </div></section>
 <section id="portfolio" style="padding-top:0"><div class="wrap">
  <div class="sec-head"><h2 class="sec">Nos <em>réalisations</em></h2>
   ${cs.length>1?`<div class="filters" role="group" aria-label="Filtrer le portfolio">${['Tout',...cs].map(c=>`<button class="chip" data-f="${esc(c)}" aria-pressed="${c===filter}">${esc(c)}</button>`).join('')}</div>`:''}</div>
  ${items.length?`<div class="grid">${items.map(([p,i])=>workCard(p,i)).join('')}</div>`:`<div class="empty">Le portfolio arrive bientôt.</div>`}
 </div></section>
 <section id="processus" style="padding-top:0"><div class="wrap">
  <div class="sec-head"><h2 class="sec">Comment on <em>travaille</em></h2></div>
  <ol class="steps">${S.process.map((p,i)=>`<li><span class="n">${String(i+1).padStart(2,'0')} / ${String(S.process.length).padStart(2,'0')}</span><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p></li>`).join('')}</ol>
 </div></section>
 <section id="apropos" style="padding-top:0"><div class="wrap about">
  <div><span class="eyebrow">À propos</span><h2 class="sec" style="margin-top:14px">${emph('Le studio *'+firstName()+'*')}</h2><p>${esc(S.about)}</p></div>
  <figure>${S.aboutImg?`<img src="${esc(S.aboutImg)}" alt="${esc(S.name)}">`:''}</figure>
 </div></section>
 <section class="contact" id="contact"><div class="wrap">
  <span class="eyebrow">Contact</span>
  <h2 style="margin-top:16px">${emph(S.heroTitle)}</h2>
  ${rows.length?`<div class="rows">${rows.map(([k,v,h])=>`<div class="row"><span class="k">${k}</span><span class="v">${h}</span>${k==='Ville'?'<span></span>':`<button class="copy" data-copy="${esc(v)}">Copier</button>`}</div>`).join('')}</div>`:`<p class="eyebrow" style="margin-top:32px">Coordonnées à venir.</p>`}
 </div></section>
 <footer><div class="wrap"><span>© ${new Date().getFullYear()} ${esc(S.name)}</span><span>${esc(S.tagline)}</span></div></footer>
 <dialog class="lb" id="lb"><div class="box"><button class="close" aria-label="Fermer">×</button><div id="lbm"></div></div><p id="lbt"></p></dialog>`;
 bind();
}
function bind(){
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();document.getElementById('portfolio').scrollIntoView({block:'start'});});
 app.querySelectorAll('.work').forEach(b=>{b.onclick=()=>openLb(+b.dataset.i);
  const v=b.querySelector('video');if(v){b.onmouseenter=()=>{v.play().catch(()=>{})};b.onmouseleave=()=>{v.pause()};}});
 app.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const t=b.dataset.copy;try{await navigator.clipboard.writeText(t);b.textContent='Copié';}catch(e){const s=b.parentElement.querySelector('.v');const r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent='Sélectionné';}setTimeout(()=>b.textContent='Copier',1600);});
 const lb=document.getElementById('lb');lb.querySelector('.close').onclick=()=>lb.close();lb.addEventListener('close',()=>{document.getElementById('lbm').innerHTML='';});
 lb.addEventListener('click',e=>{if(e.target===lb)lb.close();});
}
function openLb(i){const p=S.portfolio[i];if(!p)return;const lb=document.getElementById('lb');
 document.getElementById('lbm').innerHTML=p.type==='video'?`<video src="${esc(p.src)}" ${p.poster?`poster="${esc(p.poster)}"`:''} controls autoplay playsinline></video>`:`<img src="${esc(p.src)}" alt="${esc(p.title)}">`;
 document.getElementById('lbt').textContent=[p.title,p.meta].filter(Boolean).join(' — ');lb.showModal();}
// timecode
let t0=performance.now();(function tick(){const el=document.getElementById('tc');if(el){const f=Math.floor((performance.now()-t0)/1000*60);const s=Math.floor(f/60),m=Math.floor(s/60);el.textContent=`00:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}:${String(f%60).padStart(2,'0')}`;}
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick);})();
render();

/* ================= Editor (only for people who can edit) ================= */
let ART=null,ASSETS=null,dirty=false,tab='id';
(async()=>{try{
 const user=await window.claude?.use?.('user');const can=user?await user.canEdit():false;
 if(!can)return;
 ART=await window.claude.use('artifact');if(!ART)return;
 ASSETS=await window.claude.use('assets');
 const fab=document.createElement('button');fab.className='btn primary edit-fab';fab.textContent='✎ Personnaliser';fab.onclick=openEd;document.body.appendChild(fab);
 try{const d=sessionStorage.getItem('jom-draft');if(d){Object.assign(S,JSON.parse(d));sessionStorage.removeItem('jom-draft');render();}}catch(e){}
}catch(e){}})();
function field(id,label,val,type='text',hint=''){return `<label for="${id}">${label}${type==='area'?`<textarea id="${id}">${esc(val)}</textarea>`:`<input type="${type}" id="${id}" value="${esc(val)}">`}${hint?`<p class="hint">${hint}</p>`:''}</label>`;}
function openEd(){if(document.getElementById('ed'))return;const ed=document.createElement('aside');ed.className='ed';ed.id='ed';ed.setAttribute('aria-label','Personnaliser le site');
 ed.innerHTML=`<header><b>Personnaliser</b><button class="mini" id="edx">Fermer</button></header>
 <div class="tabs" role="tablist">${[['id','Identité'],['style','Couleurs'],['txt','Textes'],['pf','Portfolio'],['ct','Contact']].map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join('')}</div>
 <div class="body" id="edb"></div>
 <footer><span class="status" id="eds">${dirty?'Modifications non publiées':'Aucune modification'}</span><button class="btn primary" id="edp">Publier</button></footer>`;
 document.body.appendChild(ed);
 ed.querySelector('#edx').onclick=()=>ed.remove();
 ed.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;ed.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));panel();});
 ed.querySelector('#edp').onclick=publish;panel();}
function mark(){dirty=true;const s=document.getElementById('eds');if(s)s.textContent='Modifications non publiées';}
function setStatus(t){const s=document.getElementById('eds');if(s)s.textContent=t;}
function bindInputs(map){Object.entries(map).forEach(([id,fn])=>{const el=document.getElementById(id);if(el)el.addEventListener('input',()=>{fn(el.value);mark();render();});});}
function panel(){const b=document.getElementById('edb');if(!b)return;
 if(tab==='id'){b.innerHTML=field('f-name','Nom du studio',S.name,'text','Le premier mot devient le logo du menu ; la lettre Ø ou O prend la couleur d\'accent.')+field('f-tag','Slogan',S.tagline)+field('f-ht','Grand titre d\'accueil',S.heroTitle,'text','Entourez un mot d\'astérisques pour le mettre en italique couleur : *histoire*')+field('f-hs','Texte sous le titre',S.heroSub,'area')+
  `<fieldset><legend>Vidéo d'accueil (showreel)</legend><p class="hint">MP4 ou WebM, 20 Mo maximum. Elle tourne en boucle, sans le son.</p><div class="upl"><input type="file" id="u-hero" accept="video/mp4,video/webm,image/jpeg,image/png,image/webp"><button class="mini danger" id="rm-hero">Retirer</button></div></fieldset>`;
  bindInputs({'f-name':v=>S.name=v,'f-tag':v=>S.tagline=v,'f-ht':v=>S.heroTitle=v,'f-hs':v=>S.heroSub=v});
  upl('u-hero',async(f,r)=>{if(f.type.startsWith('video')){S.heroVideo=r.url;S.heroPoster=await poster(f)||'';}else{S.heroVideo='';S.heroPoster=r.url;}});
  document.getElementById('rm-hero').onclick=()=>{S.heroVideo='';S.heroPoster='';mark();render();};}
 if(tab==='style'){b.innerHTML=`<fieldset><legend>Couleur d'accent</legend><div class="sw">${ACCENTS.map(([c,n])=>`<button style="background:${c}" data-c="${c}" aria-label="${n}" aria-pressed="${S.accent.toLowerCase()===c.toLowerCase()}"></button>`).join('')}<label for="f-acc" style="flex-direction:row;align-items:center;gap:8px">Autre <input type="color" id="f-acc" value="${esc(S.accent)}"></label></div></fieldset>
  <fieldset><legend>Ambiance</legend><div class="seg">${[['dark','Sombre'],['light','Clair']].map(([k,l])=>`<button data-m="${k}" aria-pressed="${S.mode===k}">${l}</button>`).join('')}</div></fieldset>
  <fieldset><legend>Police des titres</legend><div class="seg">${Object.entries(FONTS).map(([k,[f,l]])=>`<button data-fo="${k}" aria-pressed="${S.font===k}" style="font-family:${f};font-size:16px">${l}</button>`).join('')}</div></fieldset>
  <fieldset><legend>Bandeau défilant</legend>${field('f-mq','Mots séparés par des virgules',(S.marquee||[]).join(', '))}</fieldset>`;
  b.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{S.accent=x.dataset.c;mark();render();panel();});
  document.getElementById('f-acc').addEventListener('input',e=>{S.accent=e.target.value;mark();render();});
  b.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{S.mode=x.dataset.m;mark();render();panel();});
  b.querySelectorAll('[data-fo]').forEach(x=>x.onclick=()=>{S.font=x.dataset.fo;mark();render();panel();});
  bindInputs({'f-mq':v=>S.marquee=v.split(',').map(s=>s.trim()).filter(Boolean)});}
 if(tab==='txt'){b.innerHTML=`<fieldset><legend>Services</legend>${S.services.map((s,i)=>field('sv-t'+i,'Titre '+(i+1),s.t)+field('sv-d'+i,'Description',s.d,'area')).join('')}</fieldset>
  <fieldset><legend>Processus</legend>${S.process.map((s,i)=>field('pr-t'+i,'Étape '+(i+1),s.t)+field('pr-d'+i,'Description',s.d,'area')).join('')}</fieldset>
  <fieldset><legend>À propos</legend>${field('f-ab','Texte',S.about,'area')}<div class="upl"><span class="hint">Image :</span><input type="file" id="u-ab" accept="image/jpeg,image/png,image/webp"></div></fieldset>`;
  const m={'f-ab':v=>S.about=v};S.services.forEach((s,i)=>{m['sv-t'+i]=v=>s.t=v;m['sv-d'+i]=v=>s.d=v;});S.process.forEach((s,i)=>{m['pr-t'+i]=v=>s.t=v;m['pr-d'+i]=v=>s.d=v;});bindInputs(m);
  upl('u-ab',async(f,r)=>{S.aboutImg=r.url;});}
 if(tab==='pf'){b.innerHTML=`<fieldset><legend>Ajouter une vidéo ou une photo</legend><p class="hint">JPG, PNG, WebP, MP4 ou WebM, 20 Mo maximum par fichier.</p><div class="upl"><input type="file" id="u-pf" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" multiple></div></fieldset>
  ${S.portfolio.map((p,i)=>`<div class="item"><div class="th" style="${p.type==='image'||p.poster?`background-image:url('${esc(p.poster||p.src)}')`:''}">${p.type==='video'&&!p.poster?`<video src="${esc(p.src)}#t=1" muted preload="metadata"></video>`:''}</div><div class="f">
   <input type="text" id="pt${i}" value="${esc(p.title)}" aria-label="Titre">
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input type="text" id="pc${i}" value="${esc(p.cat)}" aria-label="Catégorie" placeholder="Catégorie"><input type="text" id="pm${i}" value="${esc(p.meta)}" aria-label="Détail" placeholder="ex. 16:9 · 00:28"></div>
   <select id="pl${i}" aria-label="Taille de la vignette"><option value="">Vignette normale</option><option value="wide"${p.layout==='wide'?' selected':''}>Large</option><option value="tall"${p.layout==='tall'?' selected':''}>Haute (vertical)</option></select>
   <div class="acts"><button class="mini" data-up="${i}">Monter</button><button class="mini" data-dn="${i}">Descendre</button><button class="mini danger" data-rm="${i}">Retirer</button></div></div></div>`).join('')}`;
  const m={};S.portfolio.forEach((p,i)=>{m['pt'+i]=v=>p.title=v;m['pc'+i]=v=>p.cat=v;m['pm'+i]=v=>p.meta=v;});bindInputs(m);
  S.portfolio.forEach((p,i)=>{document.getElementById('pl'+i).onchange=e=>{p.layout=e.target.value;mark();render();};});
  b.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>{const i=+x.dataset.up;if(i>0){[S.portfolio[i-1],S.portfolio[i]]=[S.portfolio[i],S.portfolio[i-1]];mark();render();panel();}});
  b.querySelectorAll('[data-dn]').forEach(x=>x.onclick=()=>{const i=+x.dataset.dn;if(i<S.portfolio.length-1){[S.portfolio[i+1],S.portfolio[i]]=[S.portfolio[i],S.portfolio[i+1]];mark();render();panel();}});
  b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{S.portfolio.splice(+x.dataset.rm,1);mark();render();panel();});
  upl('u-pf',async(f,r)=>{const v=f.type.startsWith('video');S.portfolio.unshift({type:v?'video':'image',src:r.url,poster:v?(await poster(f)||''):'',title:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),cat:v?'Vidéo':'Photo',meta:'',layout:''});},true);}
 if(tab==='ct'){const C=S.contact;b.innerHTML=field('c-em','Courriel',C.email,'email')+field('c-ph','Téléphone',C.phone)+field('c-ig','Instagram',C.instagram,'text','Votre @nom ou le lien complet.')+field('c-ci','Ville ou région',C.city)+'<p class="hint">Les lignes vides ne s\'affichent pas sur le site.</p>';
  bindInputs({'c-em':v=>C.email=v,'c-ph':v=>C.phone=v,'c-ig':v=>C.instagram=v,'c-ci':v=>C.city=v});}
}
function upl(id,fn,multi){const el=document.getElementById(id);if(!el)return;
 if(!ASSETS){el.disabled=true;el.insertAdjacentHTML('afterend','<p class="hint">L\'envoi de fichiers n\'est pas disponible dans cette vue.</p>');return;}
 el.onchange=async()=>{const files=[...el.files];for(const f of files){
  if(f.size>20*1024*1024){setStatus(`« ${f.name} » dépasse 20 Mo. Compressez-le puis réessayez.`);continue;}
  setStatus(`Envoi de « ${f.name} »…`);
  try{const r=await ASSETS.upload(f,{type:f.type});await fn(f,r);mark();render();setStatus(`« ${f.name} » ajouté. Pensez à publier.`);}
  catch(e){setStatus(e&&e.code==='too_large'?'Fichier trop lourd (20 Mo maximum).':e&&e.code==='unsupported_type'?'Format non accepté : utilisez JPG, PNG, WebP, MP4 ou WebM.':'L\'envoi a échoué. Réessayez dans un instant.');}}
  el.value='';panel();};}
function poster(file){return new Promise(res=>{try{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';const u=URL.createObjectURL(file);v.src=u;
 const done=x=>{URL.revokeObjectURL(u);res(x);};
 v.onloadeddata=()=>{v.currentTime=Math.min(1.5,(v.duration||2)/3);};
 v.onseeked=()=>{try{const c=document.createElement('canvas');const w=Math.min(1280,v.videoWidth);c.width=w;c.height=Math.round(v.videoHeight*w/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  c.toBlob(async b=>{if(!b)return done('');try{const r=await ASSETS.upload(b,{type:'image/jpeg'});done(r.url);}catch(e){done('');}},'image/jpeg',.85);}catch(e){done('');}};
 v.onerror=()=>done('');setTimeout(()=>done(''),15000);}catch(e){res('');}});}
function pageSource(){
 const reset=(document.head.querySelector('style')||{}).textContent||'';
 const style=document.getElementById('site-style').outerHTML;
 const fonts=[...document.querySelectorAll('link[href*="fonts.g"]')].map(l=>l.outerHTML).join('\n');
 const app=document.getElementById('site-app').outerHTML;
 const state=JSON.stringify(S).replace(/</g,'\\u003c');
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
